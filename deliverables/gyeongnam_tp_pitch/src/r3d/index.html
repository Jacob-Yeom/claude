const navyMat = () => new THREE.MeshPhysicalMaterial({ color: NAVY, metalness: 0.35, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08 });
const goldMat = () => new THREE.MeshPhysicalMaterial({ color: 0xc8963c, metalness: 1.0, roughness: 0.18, clearcoat: 0.8, envMapIntensity: 1.6 });

function edges(mesh, color = GOLD, op = 1) {
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 30), new THREE.LineBasicMaterial({ color, transparent: op < 1, opacity: op }));
  l.position.copy(mesh.position); l.rotation.copy(mesh.rotation); l.scale.copy(mesh.scale); return l;
}
function stdLights(shadow = true) {
  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x223044, 0.9));
  const d = new THREE.DirectionalLight(0xffffff, 2.4); d.position.set(6, 12, 8); d.castShadow = shadow;
  d.shadow.mapSize.set(2048, 2048); Object.assign(d.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); d.shadow.radius = 6; scene.add(d);
  const r = new THREE.DirectionalLight(0x9fc8ff, 1.0); r.position.set(-8, 5, -4); scene.add(r);
}
function shadowFloor(size = 40, op = 0.18) {

let camera, anchors = {}, composer = null;

// ---------------- scenes ----------------
const scenes = {
  // dark premium city/factory backdrop for cover / closing
  cover(variant) {
    scene.environment = null;
    scene.background = new THREE.Color(0x010204); scene.fog = new THREE.FogExp2(0x0a0907, 0.016);
    // sky dome with amber horizon glow
    const sky = new THREE.Mesh(new THREE.SphereGeometry(180, 48, 24), new THREE.ShaderMaterial({ side: THREE.BackSide, fog: false, uniforms: {},

    scene.add(sky);
    const mirror = new Reflector(new THREE.PlaneGeometry(400, 400), { textureWidth: W, textureHeight: H, color: 0x2a2c33 });
    mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
    const film = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: 0x020306, transparent: true, opacity: 0.72 }));
    film.rotation.x = -Math.PI / 2; film.position.y = 0.01; scene.add(film);
    const grid = new THREE.GridHelper(400, 160, 0x5a4420, 0x10141c); grid.position.y = 0.02; grid.material.transparent = true; grid.material.opacity = 0.28; scene.add(grid);
    scene.add(new THREE.HemisphereLight(0x22324f, 0x000000, 0.25));
    const key = new THREE.DirectionalLight(0xffb866, 0.3); key.position.set(30, 25, -40); scene.add(key);
    const fill = new THREE.DirectionalLight(0x5a86c8, 0.25); fill.position.set(-30, 20, 30); scene.add(fill);
    const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x05070b, metalness: 0.6, roughness: 0.32, clearcoat: 0.5, clearcoatRoughness: 0.4 });
    const winGold = new THREE.MeshBasicMaterial({ color: 0xffbf62 }), winCyan = new THREE.MeshBasicMaterial({ color: 0x58cfff });
    let seed = variant === 'end' ? 7 : 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const rows = 15, cols = 15, sp = 2.6;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const x = (i - cols / 2) * sp, z = (j - rows / 2) * sp;

      scene.add(edges(b, 0x9a7638, 0.5));
      const step = 0.32, nStr = Math.floor(hgt / step);
      for (let k = 1; k < nStr; k++) {
        if (rnd() < 0.5) continue;
        const m = rnd() < 0.72 ? winGold : winCyan;
        const s = new THREE.Mesh(new THREE.PlaneGeometry(w * (0.3 + rnd() * 0.6), 0.04), m); s.position.set(x, k * step, z + d / 2 + 0.005); scene.add(s);
        if (rnd() < 0.6) { const s2 = new THREE.Mesh(new THREE.PlaneGeometry(d * (0.3 + rnd() * 0.6), 0.04), m); s2.rotation.y = Math.PI / 2; s2.position.set(x + w / 2 + 0.005, k * step, z); scene.add(s2); }
        if (rnd() < 0.5) { const s3 = new THREE.Mesh(new THREE.PlaneGeometry(d * (0.3 + rnd() * 0.6), 0.04), m); s3.rotation.y = -Math.PI / 2; s3.position.set(x - w / 2 - 0.005, k * step, z); scene.add(s3); }

    const halo2 = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.025, 8, 128), arcMatC); halo2.rotation.x = Math.PI / 2; halo2.position.y = 14.1; scene.add(halo2);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 30, 8), new THREE.MeshBasicMaterial({ color: 0xffe0a8, transparent: true, opacity: 0.7 })); beam.position.y = 29; scene.add(beam);
    // particles

    for (let k = 0; k < N; k++) { arr[k * 3] = (rnd() - 0.5) * 70; arr[k * 3 + 1] = rnd() * 22; arr[k * 3 + 2] = (rnd() - 0.5) * 70; }
    pg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffd69a, size: 0.06, transparent: true, opacity: 0.8 })));
    if (variant === 'end') persp(26, [-52, 13, 44], [-13, 4.5, 0]);

    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.5, 0.55));
    composer.addPass(new OutputPass());
  },

  // stacked platform layers (Konan Maestro)
  stack() {

    for (let i = 0; i < layers; i++) {
      const y = 0.75 + i * gap, top = i === layers - 1;

      // glowing inset band
      const band = new THREE.Mesh(new RoundedBoxGeometry(3.66, 0.07, 3.66, 4, 0.03), cyanGlow(top ? 0.6 : 1.2)); band.position.set(0, y, 0); scene.add(band);

        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, gap - 0.38, 12), cyanGlow(1.6)); p.position.set(px, y + gap / 2, pz); scene.add(p);
      }
    }
    // chip emblem on top
    const ch = rbox(1.2, 0.22, 1.2, navyMat(), 0, 0.75 + 4 * gap + 0.3, 0, 0.06);
    const ct = rbox(0.8, 0.06, 0.8, cyanGlow(1.0), 0, 0.75 + 4 * gap + 0.43, 0, 0.03);
    for (let k = -2; k <= 2; k++) for (const s of [1, -1]) {

      const pin2 = rbox(0.22, 0.05, 0.08, goldMat(), s * 0.68, 0.75 + 4 * gap + 0.3, k * 0.22, 0.02);
    }

  // 3D growth bars (generic: values via ?v=1,2,3)
  bars() {

    vals.forEach((v, i) => {
      const h = 0.35 + 4.2 * v / mx, last = i === n - 1;
      const b = rbox(1.15, h, 1.15, last ? goldMat() : navyMat(), x0 + i * sp, 0.3 + h / 2, 0, 0.1);
      const cap = rbox(1.2, 0.07, 1.2, last ? cyanGlow(0.5) : goldMat(), x0 + i * sp, 0.3 + h + 0.03, 0, 0.03);
      anchor('T' + i, x0 + i * sp, 0.3 + h + 0.15, 0); anchor('B' + i, x0 + i * sp, 0.3, 0.6);

    if (q.get('arrow') !== '0') {
    const pts = vals.map((v, i) => new THREE.Vector3(x0 + i * sp, 0.3 + 0.35 + 4.2 * v / mx + 0.9, -0.2));
    const curve = new THREE.CatmullRomCurve3(pts);

    const tip = pts[pts.length - 1], prev = curve.getPointAt(0.97);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.42, 24), cyanGlow(1.2)); cone.position.copy(tip);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tip.clone().sub(prev).normalize()); scene.add(cone);
    }
    ortho(3.6, [0, 4.5, 14], [0, 2.4, 0]);
  },

  // ascending steps (roadmap)
  steps() {
    stdLights(); shadowFloor(40, 0.2);
    const n = +(q.get('n') || 3), sp = 2.3;
    for (let i = 0; i < n; i++) {
      const h = 0.8 + i * 1.05, x = (i - (n - 1) / 2) * sp, last = i === n - 1;
      rbox(2.15, h, 2.4, navyMat(), x, h / 2, 0, 0.1);
      rbox(2.2, 0.12, 2.45, last ? goldMat() : goldMat(), x, h + 0.04, 0, 0.04);
      const glow = new THREE.Mesh(new THREE.BoxGeometry(2.17, 0.05, 0.02), cyanGlow(1.4)); glow.position.set(x, h - 0.25, 1.21); scene.add(glow);
      anchor('T' + i, x, h + 0.12, 0); anchor('F' + i, x, h * 0.45, 1.2);
    }
    // flag on top
    const lx = ((n - 1) / 2) * sp, lh = 0.8 + (n - 1) * 1.05;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.9, 16), goldMat()); pole.position.set(lx + 0.3, lh + 1.05, -0.3); pole.castShadow = true; scene.add(pole);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 24), goldMat()); ball.position.set(lx + 0.3, lh + 2.02, -0.3); scene.add(ball);

    const flag = new THREE.Mesh(fg, new THREE.MeshPhysicalMaterial({ color: 0x2a6fd6, metalness: 0.2, roughness: 0.3, clearcoat: 1, side: THREE.DoubleSide })); flag.position.set(lx + 0.82, lh + 1.65, -0.3); flag.castShadow = true; scene.add(flag);
    ortho(3.7, [7, 6.5, 12], [0, 1.9, 0]);
  },

      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.05, 48), goldMat()); t.position.set(x, 0.82, z); scene.add(t);
      const c = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, 1.4, 0), new THREE.Vector3(x / 2, 2.2, z / 2), new THREE.Vector3(x, 0.85, z));
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(c, 48, 0.03, 8), cyanGlow(1.4)));
      const d = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), cyanGlow(2)); d.position.set(x, 0.92, z); scene.add(d);
      anchor('P' + i, x, 0.9, z);

  // two pedestals with arrow (phase 1 -> 2)
  phases() {
    stdLights(); shadowFloor(40, 0.2);
    const mk = (x, r, h, gold) => {
      const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.05, h, 64), navyMat()); b.position.set(x, h / 2, 0); b.castShadow = true; scene.add(b);
      const t = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.02, r * 1.02, 0.08, 64), gold ? goldMat() : cyanGlow(0.8)); t.position.set(x, h + 0.04, 0); scene.add(t);

  // knowledge graph sphere (ontology / tacit knowledge)
  graph() {
    stdLights(false);
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const nodes = [];

      const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 2.6 * Math.cbrt(0.35 + 0.65 * rnd());
      nodes.push(new THREE.Vector3(Math.sqrt(1 - u * u) * Math.cos(th) * r, u * r, Math.sqrt(1 - u * u) * Math.sin(th) * r));
    }
    nodes.forEach((p, i) => {
      const big = i % 7 === 0;
      const m = new THREE.Mesh(new THREE.SphereGeometry(big ? 0.26 : 0.14, 32, 32), big ? goldMat() : (i % 3 ? navyMat() : cyanGlow(0.9))); m.position.copy(p); scene.add(m);
    });
    const lm = new THREE.MeshStandardMaterial({ color: 0x7fb8e8, metalness: 0.3, roughness: 0.4 });
    nodes.forEach((p, i) => {
      const ds = nodes.map((o, j) => [o.distanceTo(p), j]).sort((a, b) => a[0] - b[0]).slice(1, 3);
      ds.forEach(([d, j]) => { if (j < i) return; const c = new THREE.LineCurve3(p, nodes[j]); scene.add(new THREE.Mesh(new THREE.TubeGeometry(c, 1, 0.022, 6), lm)); });
